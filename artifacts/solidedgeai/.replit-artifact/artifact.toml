kind = "web"
previewPath = "/"
title = "GALINYX OS"
description = "GALINYX OS application-layer AI platform preview with a local runtime prototype and supporting learning resources. In development; not production-ready."
version = "1.0.0"
id = "artifacts/solidedgeai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26223

[services.development]
run = "pnpm --filter @workspace/solidedgeai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solidedgeai", "run", "build" ]
serve = "static"
publicDir = "artifacts/solidedgeai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26223"
BASE_PATH = "/"
