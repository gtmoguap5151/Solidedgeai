name: Galinyx Preview

on:
  push:
    branches: [galinyx-launch]
    paths:
      - "galinyx-site/**"
      - ".github/workflows/galinyx-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: galinyx-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify site files
        run: |
          test -s galinyx-site/index.html
          grep -q 'GALINYX' galinyx-site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: galinyx-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
