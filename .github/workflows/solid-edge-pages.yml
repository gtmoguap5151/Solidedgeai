name: Publish Solid Edge AI free learning site

on:
  push:
    branches: [main]
    paths:
      - "artifacts/solidedgeai/**"
      - "lib/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/solid-edge-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pnpm
        run: npm install --global pnpm@10.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build public, static version
        env:
          BASE_PATH: /Solidedgeai/
          VITE_CHECKOUT_ENABLED: "false"
        run: pnpm --filter @workspace/solidedgeai run build
      - name: Allow refresh on deep-linked app routes
        run: cp artifacts/solidedgeai/dist/public/index.html artifacts/solidedgeai/dist/public/404.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/solidedgeai/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
