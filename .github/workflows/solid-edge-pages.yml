name: Publish GALINYX OS official landing site

on:
  push:
    branches: [main]
    paths:
      - "galinyx-site/**"
      - ".github/workflows/solid-edge-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the source
        uses: actions/checkout@v4
      - name: Validate official landing page
        run: |
          test -s galinyx-site/index.html
          grep -q 'GALINYX OS' galinyx-site/index.html
          grep -q 'name="viewport"' galinyx-site/index.html
          ! grep -Ei 'sk-[a-zA-Z0-9]{16,}|SUPABASE_SERVICE_ROLE_KEY' galinyx-site/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload GALINYX OS site
        uses: actions/upload-pages-artifact@v3
        with:
          path: galinyx-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GALINYX OS to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
